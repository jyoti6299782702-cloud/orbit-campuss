<!-- Global Login / Register Popup Modal -->
<div id="authModal" class="modal-overlay">
  <div class="modal-content">
    <span class="close-modal" onclick="closeAuthModal()">&times;</span>
    <div class="auth-tabs">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">🔑 Login</button>
      <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">📝 Register</button>
    </div>

    <!-- Login Form -->
    <form id="modalLoginForm" class="auth-form active">
      <div class="form-group">
        <label>📧 Email</label>
        <input type="email" id="modalLoginEmail" class="form-control" placeholder="Enter email" required>
      </div>
      <div class="form-group">
        <label>🔒 Password</label>
        <input type="password" id="modalLoginPass" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-sky" style="width: 100%; justify-content: center; margin-top: 1rem;">Login 🚀</button>
    </form>

    <!-- Register Form -->
    <form id="modalRegisterForm" class="auth-form">
      <div class="form-group">
        <label>👤 Full Name</label>
        <input type="text" id="modalRegName" class="form-control" placeholder="Enter full name" required>
      </div>
      <div class="form-group">
        <label>📧 Email</label>
        <input type="email" id="modalRegEmail" class="form-control" placeholder="Enter email" required>
      </div>
      <div class="form-group">
        <label>🔒 Password</label>
        <input type="password" id="modalRegPass" class="form-control" placeholder="Create password" required>
      </div>
      <button type="submit" class="btn btn-sky" style="width: 100%; justify-content: center; margin-top: 1rem;">Create Account ✨</button>
    </form>
  </div>
</div>

<script>
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
    
    if(tab === 'login') {
      document.getElementById('tabLogin').classList.add('active');
      document.getElementById('modalLoginForm').classList.add('active');
    } else {
      document.getElementById('tabRegister').classList.add('active');
      document.getElementById('modalRegisterForm').classList.add('active');
    }
  }

  // Handle Register
  document.getElementById('modalRegisterForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const users = JSON.parse(localStorage.getItem('orbit_users') || '[]');
    const email = document.getElementById('modalRegEmail').value;
    
    if (users.find(u => u.email === email)) {
      alert('Email already registered!');
      return;
    }

    const newUser = {
      name: document.getElementById('modalRegName').value,
      email: email,
      password: document.getElementById('modalRegPass').value
    };

    users.push(newUser);
    localStorage.setItem('orbit_users', JSON.stringify(users));
    alert('Registration successful! Please login.');
    switchTab('login');
  });

  // Handle Login
  document.getElementById('modalLoginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const users = JSON.parse(localStorage.getItem('orbit_users') || '[]');
    const email = document.getElementById('modalLoginEmail').value;
    const pass = document.getElementById('modalLoginPass').value;

    const user = users.find(u => u.email === email && u.password === pass);

    if (user) {
      localStorage.setItem('orbit_current_user', JSON.stringify(user));
      alert(`Welcome back, ${user.name}!`);
      
      const redirectUrl = document.getElementById('authModal').dataset.redirect || 'dashboard.html';
      window.location.href = redirectUrl;
    } else {
      alert('Invalid email or password!');
    }
  });
</script>
