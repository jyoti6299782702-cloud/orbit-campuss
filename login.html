<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Orbit Campus | Auth</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      max-width: 420px;
      margin: 4rem auto;
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }
    .auth-tabs {
      display: flex;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border-color);
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      color: #64748b;
    }
    .tab-btn.active {
      color: var(--primary-sky);
      border-bottom: 3px solid var(--primary-sky);
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
    }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">🪐 Orbit Campus</a>
  </nav>

  <div class="auth-container">
    <div class="auth-tabs">
      <button class="tab-btn active" onclick="switchTab('login')">🔑 Login</button>
      <button class="tab-btn" onclick="switchTab('register')">📝 Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form active">
      <div class="form-group">
        <label>📧 Email</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label>🔒 Password</label>
        <input type="password" id="loginPass" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-sky" style="width: 100%; justify-content: center; margin-top: 1rem;">Login 🚀</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="auth-form">
      <div class="form-group">
        <label>👤 Full Name</label>
        <input type="text" id="regName" class="form-control" placeholder="Enter full name" required>
      </div>
      <div class="form-group">
        <label>📧 Email</label>
        <input type="email" id="regEmail" class="form-control" placeholder="Enter email" required>
      </div>
      <div class="form-group">
        <label>🔒 Password</label>
        <input type="password" id="regPass" class="form-control" placeholder="Create password" required>
      </div>
      <div class="form-group">
        <label>🎭 Role</label>
        <select id="regRole" class="form-control" required>
          <option value="student">Student</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="btn btn-sky" style="width: 100%; justify-content: center; margin-top: 1rem;">Create Account ✨</button>
    </form>
  </div>

  <script src="script.js"></script>
  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
      
      if(tab === 'login') {
        event.target.classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        event.target.classList.add('active');
        document.getElementById('registerForm').classList.add('active');
      }
    }

    // Register Handling
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const users = JSON.parse(localStorage.getItem('orbit_users') || '[]');
      
      const email = document.getElementById('regEmail').value;
      if (users.find(u => u.email === email)) {
        alert('Email already registered!');
        return;
      }

      const newUser = {
        name: document.getElementById('regName').value,
        email: email,
        password: document.getElementById('regPass').value,
        role: document.getElementById('regRole').value
      };

      users.push(newUser);
      localStorage.setItem('orbit_users', JSON.stringify(users));
      alert('Registration successful! Please login now.');
      location.reload();
    });

    // Login Handling
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const users = JSON.parse(localStorage.getItem('orbit_users') || '[]');
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPass').value;

      const user = users.find(u => u.email === email && u.password === pass);

      if (user) {
        localStorage.setItem('orbit_current_user', JSON.stringify(user));
        alert(`Welcome back, ${user.name}!`);
        window.location.href = user.role === 'admin' ? 'admin.html' : 'dashboard.html';
      } else {
        alert('Invalid email or password!');
      }
    });
  </script>
</body>
</html>
